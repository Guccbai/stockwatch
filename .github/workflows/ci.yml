name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            package-lock.json

      - name: Build WebUI (includes type check)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Worker (type check + tests)
        run: |
          npm ci
          npm run typecheck
          npm test
