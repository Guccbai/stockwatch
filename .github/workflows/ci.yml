name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cf/package-lock.json

      - name: Build WebUI (includes type check)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cloudflare Workers version (type check + tests)
        working-directory: cf
        run: |
          npm ci
          npm run typecheck
          npm test

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /dev/null ./cmd/stockwatch
