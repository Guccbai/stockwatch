name: Deploy

# Deploys the Cloudflare Workers version (cf/ + web/) whenever main changes, or by hand.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see cf/README.md).
on:
  push:
    branches: [main]
    paths:
      - "cf/**"
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than racing an older one.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
    steps:
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see cf/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cf/package-lock.json

      - name: Type check and test
        working-directory: cf
        run: |
          npm ci
          npm run typecheck
          npm test

      # `npm run deploy` builds ../web, then runs `wrangler deploy` with the extra args.
      - name: Deploy
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy -- --var "VERSION:main-${GITHUB_SHA::7}"
